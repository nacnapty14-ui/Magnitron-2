name: Build Bolt Site
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: compiled-site
          path: dist/
